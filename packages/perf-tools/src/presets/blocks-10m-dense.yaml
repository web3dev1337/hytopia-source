name: "blocks-10m-dense"
description: "Generate ~10M blocks (dense fill) and connect a client to measure join chunk sync overhead"
warmupMs: 5000
phases:
  - name: setup-world
    actions:
      - type: clear_world
      - type: generate_blocks
        blockCount: 10000000
        blockTypeId: 1
        layout: dense
  - name: stabilize
    duration: 15s
  - name: join-and-measure
    collect: true
    actions:
      - type: connect_clients
        count: 1
    duration: 60s
thresholds:
  tick_duration_ms:
    avg: 14
    p99: 30
  network:
    maxBytesPerSecond: 80000000
  memory_mb:
    max: 4000

